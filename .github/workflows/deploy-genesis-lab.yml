name: Deploy Pomodoro App — genesis-lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build e deploy no genesis-lab
    runs-on: self-hosted

    env:
      IMAGE_NAME: pomodoro-app
      CONTAINER_NAME: pomodoro-app
      HOST_PORT: 8081
      CONTAINER_PORT: 80

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Build da aplicação
        run: npm run build

      - name: Build da imagem Docker
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Parar container antigo (se existir)
        run: docker stop ${{ env.CONTAINER_NAME }} || true

      - name: Remover container antigo (se existir)
        run: docker rm ${{ env.CONTAINER_NAME }} || true

      - name: Subir novo container
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart unless-stopped \
            -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
            ${{ env.IMAGE_NAME }}:latest

      - name: Verificar container em execução
        run: docker ps --filter "name=${{ env.CONTAINER_NAME }}"
