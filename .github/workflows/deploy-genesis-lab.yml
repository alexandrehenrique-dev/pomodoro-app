name: Deploy Pomodoro App — genesis-lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pomodoro-app-genesis-lab
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build e deploy no genesis-lab
    runs-on: [self-hosted, linux, x64, genesis]

    env:
      IMAGE_NAME: pomodoro-app
      CONTAINER_NAME: pomodoro-app
      HOST_PORT: 8081
      CONTAINER_PORT: 80

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Mostrar contexto do runner
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "Workspace: $GITHUB_WORKSPACE"
          whoami
          pwd
          docker --version

      - name: Build da imagem Docker
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Parar container antigo (se existir)
        run: docker stop ${{ env.CONTAINER_NAME }} || true

      - name: Remover container antigo (se existir)
        run: docker rm ${{ env.CONTAINER_NAME }} || true

      - name: Subir novo container
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart unless-stopped \
            -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
            ${{ env.IMAGE_NAME }}:latest

      - name: Verificar container em execução
        run: docker ps --filter "name=${{ env.CONTAINER_NAME }}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: Validar aplicação publicada
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 "http://localhost:${{ env.HOST_PORT }}" >/dev/null
          echo "Pomodoro App publicado com sucesso em http://localhost:${{ env.HOST_PORT }}"
