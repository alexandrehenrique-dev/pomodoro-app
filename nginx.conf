server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — qualquer rota desconhecida serve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash de conteúdo (Vite gera nomes com hash): cache agressivo
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Arquivo de áudio na raiz do public/
    location ~* \.(mp3|ogg|wav)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Sem cache para o index.html (garantia de versão atualizada)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
